# Render Blueprint — lets you deploy with:  New +  ->  Blueprint  ->  pick this repo
services:
  - type: web
    name: bharat-yatra
    runtime: docker
    plan: free
    region: singapore          # closest Render region to India
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx256m -Xms64m"
      # Set this to your own live URL after the first deploy so the free
      # instance never hibernates (that is what causes the 502 / 503).
      - key: KEEPALIVE_URL
        value: "https://bharat-yatra1.onrender.com/api/health"
